<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑学习日志</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/editor.css"><script defer src="/editor.js"></script></head><body><main class="editor-shell"><header><h1>编辑学习日志</h1><a id="back" hidden>返回网站</a><a id="login" href="/auth/login">使用 GitHub 登录</a><button id="logout" hidden>退出</button></header><p id="status" role="status">正在检查登录状态…</p><section id="workspace" hidden><label>选择文件 <select id="files"></select></label><button id="reload">重新加载仓库版本</button><button id="restore" hidden>恢复本地草稿</button><p id="draft-status" role="status"></p><p>草稿每分钟自动保存在当前浏览器；点击提交后才会更新公开网站。</p><div class="metadata"><label>标题 <input id="meta-title"></label><label>阅读日期 <input id="meta-date" type="date"></label><label>标签 <input id="meta-tag"></label></div><div class="panes"><section><h2>Markdown（含顶部元数据）</h2><textarea id="source" spellcheck="false" aria-label="Markdown 内容"></textarea></section><section><h2>预览</h2><div id="preview" class="markdown-body"></div></section></div><button id="review">查看修改并提交</button><section id="review-panel" hidden><h2>提交前检查</h2><p>红色为原文，绿色为修改后内容。</p><div class="panes"><pre id="before"></pre><pre id="after"></pre></div><button id="commit">确认提交到 GitHub</button><button id="cancel">继续编辑</button></section><p id="publish-status" role="status"></p><a id="run-link" target="_blank" rel="noopener noreferrer" hidden>查看 GitHub 详情</a></section></main></body></html>
